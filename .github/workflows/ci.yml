name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Engine copies in sync
        run: make check-sync
      - name: ShellCheck
        run: make lint
      - name: Unit tests
        run: make test
      - name: APM install / uninstall
        run: make test-apm

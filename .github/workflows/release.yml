name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify
        run: make check-sync lint test test-apm
      - name: Check version matches tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in apm.yml packages/*/apm.yml; do
            grep -q "^version: $v$" "$f" || { echo "$f is not at version $v"; exit 1; }
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Install: \`apm install architraceio/chronicle#$GITHUB_REF_NAME\`. See CHANGELOG.md."
